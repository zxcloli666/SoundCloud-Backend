[package]
name = "api"
version = "8.2.7"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

catalog-match = { path = "../utils/catalog-match" }
sc-fingerprint = { path = "../utils/sc-fingerprint" }
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }

deadpool-redis = "0.18"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "script"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
bytes = "1"

sha2 = "0.10"
base64 = "0.22"
rand = "0.10"
hex = "0.4"
subtle = "2"

mini-moka = "0.10"

tikv-jemallocator = "0.6"

tls-common = { path = "../utils/tls-common" }
call-relay = { path = "../utils/call/relay" }

async-nats = "0.49"
qdrant-client = "1"

urlencoding = "2"
url = "2"
rand_distr = "0.4"
backend-contracts = { version = "1.0.0", path = "../backend-contracts" }
catalog-ingest = { version = "0.1.0", path = "../utils/catalog-ingest" }
catalog-normalize = { version = "0.1.0", path = "../utils/catalog-normalize" }
sc-transport = { version = "0.1.0", path = "../utils/sc-transport" }
catalog-sources = { version = "0.1.0", path = "../utils/catalog-sources" }
stream-ticket = { version = "1.0.0", path = "../utils/stream-ticket" }
redact = { version = "0.1.0", path = "../utils/redact" }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

[features]
profiling = ["dep:pprof"]

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 1
panic = "unwind"
