[package]
name = "chat-load"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Load harness for the SoundCloud Desktop chat: synthetic devices that seal, sign and park like the desktop"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chat-wire = { path = "../../utils/chat-wire" }
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
