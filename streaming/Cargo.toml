[package]
name = "streaming"
version = "8.2.7"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sc-fingerprint = { path = "../utils/sc-fingerprint" }
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli", "multipart"] }
deadpool-postgres = { version = "0.14" }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
url = "2"
futures = "0.3"
bytes = "1"
thiserror = "2"
regex = "1.12.3"
tls-common = { path = "../utils/tls-common" }
call-relay = { path = "../utils/call/relay" }
call-lua-macros = { path = "../utils/call/lua-macros" }
decrypt = { path = "../utils/decrypt" }
stream-ticket = { version = "1.0.0", path = "../utils/stream-ticket" }
once_cell = "1"
rand = "0.8"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
