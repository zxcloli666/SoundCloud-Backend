[package]
name = "sc-fingerprint"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser TLS/HTTP2 fingerprints"

[dependencies]
dashmap = "6"
once_cell = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
wreq = { version = "5", features = ["stream", "gzip", "brotli"] }
wreq-util = { version = "2", features = ["emulation-serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
