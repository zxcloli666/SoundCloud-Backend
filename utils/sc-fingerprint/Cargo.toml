[package]
name = "sc-fingerprint"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser TLS/HTTP2 fingerprints"

[dependencies]
dashmap = "6"
once_cell = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
wreq = { version = "0.16.1", features = ["stream", "gzip", "brotli", "deflate", "zstd", "charset"] }
wreq-util = { version = "=0.2.0", features = ["emulation-serde", "emulation-compression"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
