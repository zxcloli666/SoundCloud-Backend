[package]
name = "catalog-match"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared catalog matching and linking: candidate scoring, wanted-track links, artist SoundCloud identities"

[dependencies]
catalog-normalize = { version = "0.1.0", path = "../catalog-normalize" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
