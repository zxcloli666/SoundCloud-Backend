[package]
name = "admin-catalog"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Admin catalog edits that run on core in one transaction: artists, credits, wanted tracks, legacy playlist intents, enrich resets"

[dependencies]
backend-contracts = { version = "1.0.0", path = "../../backend-contracts" }
catalog-match = { version = "0.1.0", path = "../catalog-match" }
catalog-normalize = { version = "0.1.0", path = "../catalog-normalize" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
entity-ref = { version = "0.1.0", path = "../entity-ref" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
wt = { package = "write-through", version = "0.1.0", path = "../write-through", features = ["sqlx"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
