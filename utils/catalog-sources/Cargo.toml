[package]
name = "catalog-sources"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared external catalog sources: proxied HTTP, MusicBrainz, Genius"

[dependencies]
base64 = "0.22"
bytes = "1"
call-relay = { path = "../call/relay" }
call-lua-macros = { path = "../call/lua-macros" }
catalog-normalize = { version = "0.1.0", path = "../catalog-normalize" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
httpdate = "1"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli"] }

[dev-dependencies]
axum = "0.8"
sc-fingerprint = { path = "../sc-fingerprint" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
