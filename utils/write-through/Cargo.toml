[package]
name = "write-through"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "scd_wt client: run a catalog kind on the local node and ship it to core"

[features]
sqlx = ["dep:sqlx"]
tokio-postgres = ["dep:tokio-postgres"]

[dependencies]
serde = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "json"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[[test]]
name = "real_pg"
required-features = ["sqlx", "tokio-postgres"]
