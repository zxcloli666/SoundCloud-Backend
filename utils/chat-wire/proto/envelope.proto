syntax = "proto3";

package scd.chat.v1;

message Envelope {
  uint32 v = 1;
  oneof body {
    Text text = 2;
    Edit edit = 3;
    Delete delete = 4;
    Reaction reaction = 5;
    Meta meta = 6;
    Pin pin = 7;
    Suggest suggest = 8;
  }
  bytes padding = 15;
  uint64 reply_to = 16;
  repeated string mentions = 17;
  repeated Attachment attachments = 18;
  repeated Embed embeds = 19;
  Forwarded forwarded_from = 20;
}

message Text {
  string text = 1;
  repeated Span spans = 2;
}

enum SpanKind {
  SPAN_KIND_UNSPECIFIED = 0;
  SPAN_KIND_BOLD = 1;
  SPAN_KIND_ITALIC = 2;
  SPAN_KIND_CODE = 3;
  SPAN_KIND_SPOILER = 4;
  SPAN_KIND_LINK = 5;
  SPAN_KIND_MENTION = 6;
}

message Span {
  SpanKind kind = 1;
  uint32 start = 2;
  uint32 len = 3;
  string url = 4;
  string user_id = 5;
}

message Edit {
  uint64 target = 1;
  Text text = 2;
}

message Delete {
  uint64 target = 1;
}

message Reaction {
  uint64 target = 1;
  string emoji = 2;
  bool on = 3;
}

message Meta {
  string title = 1;
  string description = 2;
  string avatar_media_id = 3;
}

message Pin {
  uint64 target = 1;
  bool on = 2;
}

message Suggest {
  Embed track = 1;
}

message Forwarded {
  string user_id = 1;
  string name = 2;
  uint64 sent_at_ms = 3;
}

enum EmbedKind {
  EMBED_KIND_UNSPECIFIED = 0;
  EMBED_KIND_TRACK = 1;
  EMBED_KIND_PLAYLIST = 2;
  EMBED_KIND_USER = 3;
  EMBED_KIND_ROOM_INVITE = 4;
}

message Embed {
  EmbedKind kind = 1;
  string urn = 2;
  string permalink = 3;
  string secret_token = 4;
  string title = 5;
  string artist = 6;
  string artwork_url = 7;
  uint64 duration_ms = 8;
  string access = 9;
  uint64 at_ms = 10;
  repeated EmbedTrack tracks = 11;
  RoomInvite room = 12;
}

message EmbedTrack {
  string urn = 1;
  string title = 2;
  string artist = 3;
  uint64 duration_ms = 4;
  string artwork_url = 5;
}

message RoomInvite {
  string code = 1;
  string title = 2;
  string host = 3;
}

enum AttachmentKind {
  ATTACHMENT_KIND_UNSPECIFIED = 0;
  ATTACHMENT_KIND_IMAGE = 1;
}

message Thumb {
  string media_id = 1;
  bytes key = 2;
  bytes nonce = 3;
  uint64 size = 4;
  uint32 w = 5;
  uint32 h = 6;
}

message Attachment {
  string media_id = 1;
  AttachmentKind kind = 2;
  string mime = 3;
  uint64 size = 4;
  uint32 w = 5;
  uint32 h = 6;
  bytes thumbhash = 7;
  bytes key = 8;
  bytes nonce = 9;
  bytes sha256_plain = 10;
  bytes sha256_cipher = 11;
  Thumb thumb = 12;
}
