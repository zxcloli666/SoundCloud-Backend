syntax = "proto3";

package scd.chat.v1;

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_DIRECT = 1;
  TIER_RELAY = 2;
  TIER_PRO = 3;
}

message Bind {
  string device_id = 1;
  bytes auth_pub = 2;
  bytes box_pub = 3;
  uint64 ts_ms = 4;
  bytes sig = 5;
}

message Inner {
  uint64 ts_ms = 1;
  optional string session_id = 2;
  optional string device_id = 3;
  string method = 4;
  string path = 5;
  string query = 6;
  bytes body = 7;
  Tier tier = 8;
  uint32 max_bytes = 9;
  Bind bind = 10;
  bytes sig = 11;
}

message Header {
  string name = 1;
  string value = 2;
}

message InnerResponse {
  uint32 status = 1;
  repeated Header headers = 2;
  bytes body = 3;
}
