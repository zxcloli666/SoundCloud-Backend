global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server init-addr last,libc,none

frontend edge
    bind :8000
    acl chat_path path /rooms
    acl chat_path path_beg /chat/ /rooms/
    use_backend chat_http if chat_path
    default_backend api_http

backend api_http
    server api api:3000

backend chat_http
    server chat chat-api:3000 proto h2
