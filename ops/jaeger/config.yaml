service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces/local:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [jaeger_storage_exporter, otlp/peer]
    traces/peer:
      receivers: [otlp/peer]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_query:
    base_path: /jaeger
    storage:
      traces: kept
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685
  jaeger_storage:
    backends:
      kept:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 168h

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  otlp/peer:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317
        tls:
          cert_file: /certs/tls.crt
          key_file: /certs/tls.key
          client_ca_file: /certs/ca.pem

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 700
    spike_limit_mib: 150
  tail_sampling:
    decision_wait: 20s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 3000
      - name: debug
        type: boolean_attribute
        boolean_attribute:
          key: scd.debug
          value: true
      - name: sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 2
  batch:
    timeout: 2s

exporters:
  jaeger_storage_exporter:
    trace_storage: kept
  otlp/peer:
    endpoint: ${env:TELEMETRY_PEER}
    timeout: 10s
    tls:
      cert_file: /certs/tls.crt
      key_file: /certs/tls.key
      ca_file: /certs/ca.pem
    sending_queue:
      enabled: true
      queue_size: 2000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
