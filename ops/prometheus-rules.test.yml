rule_files:
  - prometheus-rules.yml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: 'scd_cmd_dead{kind="track.edit"}'
        values: '0 0 1+0x30'
      - series: 'scd_cmd_dead{kind="comment.post"}'
        values: '0+0x32'
      - series: 'scd_cmd_dead_oldest_seconds{kind="track.edit"}'
        values: '0 0 100+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ReplDeadCommand
      - eval_time: 25m
        alertname: ReplDeadCommand
        exp_alerts:
          - exp_labels:
              kind: track.edit
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Dead commands of kind track.edit wait on core"
              description: "Core ran an api command and the kind failed with an error that retrying cannot fix. The api already got core's row back (reassert or purge). Read cmd_dead, fix the cause, then replay with the repl.replay_dead job. Dead letters are deleted after 7 days."
      - eval_time: 25m
        alertname: ReplDeadCommandAged

  - interval: 1m
    input_series:
      - series: 'scd_cmd_dead_oldest_seconds{kind="track.edit"}'
        values: '500000+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ReplDeadCommandAged
        exp_alerts:
          - exp_labels:
              kind: track.edit
              severity: critical
              service: jobs
            exp_annotations:
              summary: "A dead command of kind track.edit is older than 5 days"
              description: "Retention deletes dead letters after 7 days, and a deleted letter can no longer be replayed."

  - interval: 1m
    input_series:
      - series: 'scd_cmd_sub_up{sub="core_from_main"}'
        values: '1+0x10 0+0x30'
      - series: 'scd_cmd_sub_up{sub="core_from_star"}'
        values: '1+0x40'
      - series: 'scd_cmd_age_seconds{sub="core_from_main"}'
        values: '0+0x10 300+0x30'
      - series: 'scd_cmd_backlog{sub="core_from_main"}'
        values: '0+0x10 1048576+0x30'
      - series: 'scd_cmd_age_seconds{sub="core_from_star"}'
        values: '300+0x40'
      - series: 'scd_cmd_backlog{sub="core_from_star"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: ReplSubscriptionDown
      - eval_time: 20m
        alertname: ReplSubscriptionDown
        exp_alerts:
          - exp_labels:
              sub: core_from_main
              severity: critical
              service: jobs
            exp_annotations:
              summary: "Core does not apply the stream of core_from_main"
              description: "The subscription is disabled or its apply worker is gone. Commands of that api node wait in its outbox and retention keeps every tombstone and receipt."
      - eval_time: 25m
        alertname: ReplApplyStuck
        exp_alerts:
          - exp_labels:
              sub: core_from_main
              severity: critical
              service: jobs
            exp_annotations:
              summary: "The apply worker of core_from_main has not moved for 5m 0s"
              description: "Data is received but not applied. Usual causes are a row lock held by a long job on a replicated table, or a poison transaction the worker retries every 5 seconds."

  - interval: 1m
    input_series:
      - series: 'scd_repl_retention_held{instance="core",table="repl_tombstones",reason="slot"}'
        values: '0+0x10 1+0x450'
      - series: 'scd_repl_retention_held{instance="core",table="repl_tombstones",reason="resend"}'
        values: '0+0x450'
      - series: 'scd_repl_retention_held{instance="core",table="cmd_done",reason="slot"}'
        values: '1+0x100 0+0x450'
      - series: 'scd_repl_retention_held{instance="main",table="cmd_outbox",reason="pending"}'
        values: '0+0x80 1+0x450'
      - series: 'scd_repl_retention_held{instance="star",table="cmd_outbox",reason="pending"}'
        values: '0+0x450'
      - series: 'scd_repl_resend_queued{instance="main"}'
        values: '0+0x10 5+0x60'
      - series: 'scd_repl_resend_queued{instance="star"}'
        values: '0+0x10 5+0x10 0+0x50'
    alert_rule_test:
      - eval_time: 5h
        alertname: ReplRetentionHeld
      - eval_time: 7h
        alertname: ReplRetentionHeld
        exp_alerts:
          - exp_labels:
              instance: core
              table: repl_tombstones
              reason: slot
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Retention of repl_tombstones on core is held back for 6 hours (slot)"
              description: "A slot or subscription is inactive or behind, a node still has pending resends, or (reason pending) api commands got no answer from core for 2 days and keep their rows. The held tables only grow meanwhile. Detail: the jobs log line 'replication retention held back' for core tables, the api log line 'scd node retention held back' for cmd_outbox and oauth_app_tokens_local."
      - eval_time: 7h30m
        alertname: ReplRetentionHeld
        exp_alerts:
          - exp_labels:
              instance: core
              table: repl_tombstones
              reason: slot
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Retention of repl_tombstones on core is held back for 6 hours (slot)"
              description: "A slot or subscription is inactive or behind, a node still has pending resends, or (reason pending) api commands got no answer from core for 2 days and keep their rows. The held tables only grow meanwhile. Detail: the jobs log line 'replication retention held back' for core tables, the api log line 'scd node retention held back' for cmd_outbox and oauth_app_tokens_local."
          - exp_labels:
              instance: main
              table: cmd_outbox
              reason: pending
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Retention of cmd_outbox on main is held back for 6 hours (pending)"
              description: "A slot or subscription is inactive or behind, a node still has pending resends, or (reason pending) api commands got no answer from core for 2 days and keep their rows. The held tables only grow meanwhile. Detail: the jobs log line 'replication retention held back' for core tables, the api log line 'scd node retention held back' for cmd_outbox and oauth_app_tokens_local."
      - eval_time: 60m
        alertname: ReplResendQueueStuck
        exp_alerts:
          - exp_labels:
              instance: main
              severity: warning
              service: jobs
            exp_annotations:
              summary: "A node has kept resend keys queued for 30 minutes"
              description: "The sweeper ships pending resends within seconds. Retention of tombstones and receipts waits for every queue to be empty."

  - interval: 1m
    input_series:
      - series: 'api_http_requests_total{job="api",instance="main",status="200"}'
        values: '0+5400x20'
      - series: 'api_http_requests_total{job="api",instance="main",status="503"}'
        values: '0+600x20'
      - series: 'api_session_miss_total{job="api",instance="main",outcome="in_flight"}'
        values: '0+540x20'
      - series: 'api_http_requests_total{job="api",instance="star",status="200"}'
        values: '0+5400x20'
      - series: 'api_http_requests_total{job="api",instance="star",status="503"}'
        values: '0+600x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiHostUnavailable
        exp_alerts:
          - exp_labels:
              instance: star
              severity: critical
              service: api
            exp_annotations:
              summary: "10% of api requests on star answer 503"
              description: "PoolTimedOut answers 503 (api/src/error.rs), so do search_busy and *_refresh_pending. Normal is under 2% per host (2h before 2026-10-31 08:40). At 08:42 main reached 13.6% after a cold restart. ApiServerErrors is global over 10m and missed it. A young session that has not replicated yet answers 503 too (api_session_miss_total outcome in_flight); that is replication lag and is subtracted."

  - interval: 1m
    input_series:
      - series: 'api_http_requests_total{job="api",instance="main",status="200"}'
        values: '0+5700x20'
      - series: 'api_http_requests_total{job="api",instance="main",status="503"}'
        values: '0+300x20'
      - series: 'api_session_miss_total{job="api",instance="main",outcome="in_flight"}'
        values: '0+300x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiServerErrors

  - interval: 1m
    input_series:
      - series: 'api_http_requests_total{job="api",instance="main",status="200"}'
        values: '0+5700x20'
      - series: 'api_http_requests_total{job="api",instance="main",status="503"}'
        values: '0+300x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiServerErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
            exp_annotations:
              summary: "More than 2% of answers are 5xx"
              description: "Smoke and load suites finish with zero errors, so any sustained 5xx share is new. The 503 for a young session that has not replicated to this node yet (api_session_miss_total outcome in_flight) is replication lag, not an error, and is not counted."

  - interval: 1m
    input_series:
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/tracks/{id}",le="+Inf"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/tracks/{id}",le="2.5"}'
        values: '0+540x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/tracks/{id}",le="5"}'
        values: '0+570x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/users/{id}/likes",le="+Inf"}'
        values: '0+3x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/users/{id}/likes",le="2.5"}'
        values: '0+0x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/users/{id}/likes",le="5"}'
        values: '0+0x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/health",le="+Inf"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/health",le="2.5"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/health",le="5"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="+Inf"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="2.5"}'
        values: '0+0x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="5"}'
        values: '0+0x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/albums/{id}",le="+Inf"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/albums/{id}",le="2.5"}'
        values: '0+576x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/albums/{id}",le="5"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/playlists/{id}",le="+Inf"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/playlists/{id}",le="2.5"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/playlists/{id}",le="5"}'
        values: '0+588x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiLatencyDegraded
      - eval_time: 30m
        alertname: ApiLatencyDegraded
        exp_alerts:
          - exp_labels:
              route: /tracks/{id}
              severity: warning
              service: api
            exp_annotations:
              summary: "More than 5% of requests on /tracks/{id} take over 2.5s"
              description: "Alloy keeps only the api buckets 0.1, 0.5, 1, 2.5, 5 and 10, so a p99 is an interpolation between far bounds and is not used. This is the share of requests slower than the 2.5s bound over 15m. Routes under 0.1 requests a second (90 in the window) are ignored, so five slow requests are needed before it can fire. Semantic search is excluded on purpose: a cold query waits for the encoder."
      - eval_time: 30m
        alertname: ApiLatencyCritical
        exp_alerts:
          - exp_labels:
              route: /tracks/{id}
              severity: critical
              service: api
            exp_annotations:
              summary: "More than 2% of requests on /tracks/{id} take over 5s"
              description: "Share of requests slower than the 5s bound over 10m, from the kept buckets. Routes under 0.2 requests a second (120 in the window) are ignored, so three slow requests are needed before it can fire. The route timeout layer cuts at 60s and the SoundCloud read budget at 20s, so five seconds for a tail means the local path itself is stalling."

  - interval: 1m
    input_series:
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/playlists/{id}",le="+Inf"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/playlists/{id}",le="2.5"}'
        values: '0+600x40'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/playlists/{id}",le="5"}'
        values: '0+576x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiLatencyDegraded
      - eval_time: 30m
        alertname: ApiLatencyCritical
        exp_alerts:
          - exp_labels:
              route: /playlists/{id}
              severity: critical
              service: api
            exp_annotations:
              summary: "More than 2% of requests on /playlists/{id} take over 5s"
              description: "Share of requests slower than the 5s bound over 10m, from the kept buckets. Routes under 0.2 requests a second (120 in the window) are ignored, so three slow requests are needed before it can fire. The route timeout layer cuts at 60s and the SoundCloud read budget at 20s, so five seconds for a tail means the local path itself is stalling."

  - interval: 1m
    input_series:
      - series: 'jobs_queue_oldest_due_seconds{lane="core_fast"}'
        values: '1000+0x70'
      - series: 'jobs_queue_oldest_due_seconds{lane="lookup"}'
        values: '1010000+0x70'
      - series: 'jobs_queue_oldest_due_seconds{lane="core_bulk"}'
        values: '1015000+0x70'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="lookup",kind="lyrics.lookup"}'
        values: '1010000+0x70'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="core_bulk",kind="catalog.refresh"}'
        values: '1015000+0x70'
      - series: 'jobs_executions_total{kind="lyrics.lookup",outcome="ok"}'
        values: '0+30x70'
      - series: 'jobs_executions_total{kind="catalog.refresh",outcome="retryable"}'
        values: '0+30x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: JobsQueueStalling
        exp_alerts:
          - exp_labels:
              lane: core_fast
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Lane core_fast has work due for more than 15 minutes"
              description: "A job may run for up to JOBS_JOB_TIMEOUT_SECONDS (900s) with its lease renewed, so a due age above that means nobody is claiming, not that one job is slow. Bulk lanes (core_bulk, lookup) carry a long backlog by design, so there it also needs zero executions of the lane kinds in 30 minutes."

  - interval: 1m
    input_series:
      - series: 'jobs_queue_oldest_due_seconds{lane="lookup"}'
        values: '1010000+0x70'
      - series: 'jobs_queue_oldest_due_seconds{lane="core_bulk"}'
        values: '1015000+0x70'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="lookup",kind="lyrics.lookup"}'
        values: '1010000+0x70'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="core_bulk",kind="catalog.refresh"}'
        values: '1015000+0x70'
      - series: 'jobs_executions_total{kind="lyrics.lookup",outcome="ok"}'
        values: '900+0x70'
    alert_rule_test:
      - eval_time: 10m
        alertname: JobsQueueStalling
      - eval_time: 60m
        alertname: JobsQueueStalling
        exp_alerts:
          - exp_labels:
              lane: lookup
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Lane lookup has work due for more than 15 minutes"
              description: "A job may run for up to JOBS_JOB_TIMEOUT_SECONDS (900s) with its lease renewed, so a due age above that means nobody is claiming, not that one job is slow. Bulk lanes (core_bulk, lookup) carry a long backlog by design, so there it also needs zero executions of the lane kinds in 30 minutes."
          - exp_labels:
              lane: core_bulk
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Lane core_bulk has work due for more than 15 minutes"
              description: "A job may run for up to JOBS_JOB_TIMEOUT_SECONDS (900s) with its lease renewed, so a due age above that means nobody is claiming, not that one job is slow. Bulk lanes (core_bulk, lookup) carry a long backlog by design, so there it also needs zero executions of the lane kinds in 30 minutes."

  - interval: 1m
    input_series:
      - series: 'jobs_queue_depth{lane="lookup",state="pending"}'
        values: '1900000+1000x200'
      - series: 'jobs_queue_depth{lane="core_bulk",state="pending"}'
        values: '1900000+1000x200'
      - series: 'jobs_queue_depth{lane="core_fast",state="pending"}'
        values: '60000+100x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: JobsQueueGrowing
      - eval_time: 180m
        alertname: JobsQueueGrowing
        exp_alerts:
          - exp_labels:
              lane: core_fast
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Lane core_fast holds 78000 pending jobs and keeps growing"
              description: "Producers outpace the lane. Check jobs_queue_kind_depth for the kind that grows and the lane concurrency against the pool sizes. Bulk lanes (core_bulk, lookup) are not covered: their backlog is long by design and JobsQueueStalling pages when they stop completing."

  - interval: 1m
    input_series:
      - series: 'jobs_queue_kind_depth{lane="lookup",kind="lyrics.lookup",state="pending"}'
        values: '1940000+0x100'
      - series: 'jobs_queue_kind_depth{lane="core_bulk",kind="catalog.refresh",state="pending"}'
        values: '1940000+0x100'
      - series: 'jobs_queue_kind_depth{lane="core_fast",kind="player.sync",state="pending"}'
        values: '150000+0x100'
    alert_rule_test:
      - eval_time: 30m
        alertname: JobsKindBacklogLarge
      - eval_time: 90m
        alertname: JobsKindBacklogLarge
        exp_alerts:
          - exp_labels:
              lane: core_fast
              kind: player.sync
              state: pending
              severity: warning
              service: jobs
            exp_annotations:
              summary: "player.sync has 150000 pending jobs"
              description: "One kind dominates its lane. A per-event kind that never drains usually retries something that will not succeed. Bulk lanes (core_bulk, lookup) are not covered: JobsQueueStalling pages when they stop completing."

  - interval: 1m
    input_series:
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="lookup",kind="lyrics.lookup"}'
        values: '1010000+0x100'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="core_bulk",kind="catalog.refresh"}'
        values: '1015000+0x100'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="core_fast",kind="player.sync"}'
        values: '30000+0x100'
      - series: 'jobs_queue_kind_oldest_due_seconds{lane="ops",kind="admin.task"}'
        values: '3600+0x100'
      - series: 'jobs_queue_kind_oldest_age_seconds{lane="core_fast",kind="legacy.kind"}'
        values: '300000+0x100'
      - series: 'jobs_queue_kind_oldest_age_seconds{lane="lookup",kind="lyrics.lookup"}'
        values: '300000+0x100'
    alert_rule_test:
      - eval_time: 20m
        alertname: JobsKindOldestJobAged
      - eval_time: 90m
        alertname: JobsKindOldestJobAged
        exp_alerts:
          - exp_labels:
              lane: core_fast
              kind: player.sync
              severity: warning
              service: jobs
            exp_annotations:
              summary: "player.sync has had work due for more than six hours"
              description: "Measured from when the oldest job became due, not from its creation, so a long-lived retrying job does not count. Bulk lanes (core_bulk, lookup) are not covered: due work waits there for days by design and JobsQueueStalling pages when they stop completing."

  - interval: 1m
    input_series:
      - series: 'jobs_queue_dead_letters{lane="core_fast"}'
        values: '100+0x20 40+0x80'
      - series: 'jobs_queue_dead_letters{lane="lookup"}'
        values: '5+0x40 8+0x40'
      - series: 'jobs_queue_dead_letters{lane="ops"}'
        values: '0+0x40 12+0x40'
      - series: 'jobs_queue_dead_letters{lane="core_bulk"}'
        values: '100+0x30 40+0x20 52+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: JobsDeadLetters
      - eval_time: 70m
        alertname: JobsDeadLetters
        exp_alerts:
          - exp_labels:
              lane: ops
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Lane ops produced 12 dead letters in the last hour"
              description: "Jobs exhausted their retries. jobs_queue_dead_letters is a gauge of rows, so the rule adds up the rises between 5 minute samples and ignores drops (a deploy, retention, or the settled codes auth_required, not_found and forbidden no longer being counted). The payloads stay in the queue for inspection."
          - exp_labels:
              lane: core_bulk
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Lane core_bulk produced 12 dead letters in the last hour"
              description: "Jobs exhausted their retries. jobs_queue_dead_letters is a gauge of rows, so the rule adds up the rises between 5 minute samples and ignores drops (a deploy, retention, or the settled codes auth_required, not_found and forbidden no longer being counted). The payloads stay in the queue for inspection."


  - interval: 1m
    input_series:
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="+Inf"}'
        values: '0+60x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="5"}'
        values: '0+60x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="10"}'
        values: '0+54x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="+Inf"}'
        values: '0+60x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="5"}'
        values: '0+60x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="10"}'
        values: '0+59x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiSemanticSearchStuck
      - eval_time: 40m
        alertname: ApiSemanticSearchStuck
        exp_alerts:
          - exp_labels:
              route: /search/vibe
              severity: warning
              service: api
            exp_annotations:
              summary: "Semantic search on /search/vibe waits longer than its own poll loop"
              description: "More than 5% of requests slower than the 10s bound over 10m, from the kept buckets (the largest is 10, so a p99 above 11 could never be reached). A cold query waits for the encoder for at most 20 polls of 500ms, so ten seconds is the designed ceiling and a warm query is milliseconds. Routes under 0.05 requests a second (30 in the window) are ignored, so two slow requests are needed."

  - interval: 1m
    input_series:
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="+Inf"}'
        values: '0+2x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="5"}'
        values: '0+0x60'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="10"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: ApiSemanticSearchStuck

  - interval: 1m
    input_series:
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="+Inf"}'
        values: '0+60x90'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="5"}'
        values: '0+24x90'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="10"}'
        values: '0+24x90'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="+Inf"}'
        values: '0+60x90'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="5"}'
        values: '0+36x90'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/lyrics",le="10"}'
        values: '0+36x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiSemanticSearchAlwaysCold
      - eval_time: 80m
        alertname: ApiSemanticSearchAlwaysCold
        exp_alerts:
          - exp_labels:
              route: /search/vibe
              severity: warning
              service: api
            exp_annotations:
              summary: "Half of semantic searches on /search/vibe wait for the encoder"
              description: "More than half of requests slower than the 5s bound over 15m, from the kept buckets. The vector cache and the query-vector collection should make repeat queries instant. Routes under 0.02 requests a second (18 in the window) are ignored."

  - interval: 1m
    input_series:
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="+Inf"}'
        values: '0+1x90'
      - series: 'api_http_request_duration_seconds_bucket{job="api",instance="main",route="/search/vibe",le="5"}'
        values: '0+0x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: ApiSemanticSearchAlwaysCold

  - interval: 1m
    input_series:
      - series: 'auth_cleanup_last_progress_timestamp_seconds{table="login_requests"}'
        values: '0+60x60'
      - series: 'auth_cleanup_last_progress_timestamp_seconds{table="link_requests"}'
        values: '0+60x10 600+0x50'
    alert_rule_test:
      - eval_time: 39m
        alertname: AuthCleanupStalled
      - eval_time: 45m
        alertname: AuthCleanupStalled
        exp_alerts:
          - exp_labels:
              table: link_requests
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Cleanup of link_requests has not run a delete for 35m 0s"
              description: "The job runs every minute and skips while an active replication slot is more than 16 MB behind. rate(auth_cleanup_skipped_total[30m]) by why names the cause: replication_lag means a lagging subscriber, batch_cap alone does not stall it. Expired rows only grow meanwhile."
      - eval_time: 45m
        alertname: AuthCleanupNotReporting

  - interval: 1m
    input_series:
      - series: 'auth_cleanup_last_progress_timestamp_seconds{table="login_requests"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: AuthCleanupNotReporting
      - eval_time: 31m
        alertname: AuthCleanupNotReporting
        exp_alerts:
          - exp_labels:
              table: link_requests
              severity: warning
              service: jobs
            exp_annotations:
              summary: "Cleanup of link_requests has reported no delete since the jobs start"
              description: "The gauge appears after the first delete of a run. Absent for 30 minutes means every run since the restart was skipped or failed, or the job does not run on core."
      - eval_time: 31m
        alertname: AuthCleanupStalled

  - interval: 1m
    input_series:
      - series: 'api_llm_spend_micro_usd_total{job="api",host="star",ladder="chat",provider="claude",basis="reported"}'
        values: '0+1667x1600'
      - series: 'api_llm_spend_micro_usd_total{job="api",host="main",ladder="chat",provider="claude",basis="reported"}'
        values: '0+1667x1600'
      - series: 'api_llm_spend_micro_usd_total{job="api",host="star",ladder="refine",provider="claude",basis="reported"}'
        values: '0+167x1600'
      - series: 'api_llm_budget_usd{job="api",host="star",ladder="chat",period="day"}'
        values: '2.5+0x1600'
      - series: 'api_llm_budget_usd{job="api",host="main",ladder="chat",period="day"}'
        values: '2.5+0x1600'
      - series: 'api_llm_budget_usd{job="api",host="star",ladder="refine",period="day"}'
        values: '0.5+0x1600'
    alert_rule_test:
      - eval_time: 6h
        alertname: ApiLlmDaySpendHigh
      - eval_time: 26h
        alertname: ApiLlmDaySpendHigh
        exp_alerts:
          - exp_labels:
              ladder: chat
              severity: warning
              service: api
            exp_annotations:
              summary: "LLM ladder chat spent over 80% of its day budget in 24 hours"
              description: "Spend is summed over all api hosts, like the shared budget in NATS KV llm_spend. The budget counts the UTC day and this alert the last 24 hours, so it can fire a little early. Once the day budget is spent the ladder skips its priced steps for everyone until 00:00 UTC: only its free steps answer, and a ladder without free steps answers nothing. The budget is day_usd in the ladder config (Infra roles/<host>/config/llm/ladder.toml)."

  - interval: 2m
    input_series:
      - series: 'api_llm_spend_micro_usd_total{job="api",host="star",ladder="chat",provider="claude",basis="reported"}'
        values: '0+3334x5200'
      - series: 'api_llm_spend_micro_usd_total{job="api",host="star",ladder="refine",provider="claude",basis="reported"}'
        values: '0+167x5200'
      - series: 'api_llm_budget_usd{job="api",host="star",ladder="chat",period="month"}'
        values: '50+0x5200'
      - series: 'api_llm_budget_usd{job="api",host="star",ladder="refine",period="month"}'
        values: '10+0x5200'
    alert_rule_test:
      - eval_time: 170h
        alertname: ApiLlmMonthPaceHigh
        exp_alerts:
          - exp_labels:
              ladder: chat
              severity: warning
              service: api
            exp_annotations:
              summary: "LLM ladder chat spends faster than its month budget allows"
              description: "At the pace of the last 7 days the ladder would spend more than month_usd in 30 days. Once the month budget is spent the priced steps are skipped for everyone until the month ends: only the free steps answer, and a ladder without free steps answers nothing. With less than 7 days of history the pace is underestimated, never overestimated. The budget is month_usd in the ladder config (Infra roles/<host>/config/llm/ladder.toml)."

  - interval: 1m
    input_series:
      - series: 'api_llm_steps_total{job="api",host="star",ladder="chat",provider="proxy_fast",result="failed_request"}'
        values: '0+1x90'
      - series: 'api_llm_steps_total{job="api",host="star",ladder="chat",provider="proxy_fast",result="won"}'
        values: '0+4x90'
      - series: 'api_llm_steps_total{job="api",host="star",ladder="chat",provider="local",result="failed_request"}'
        values: '0+0.05x90'
      - series: 'api_llm_steps_total{job="api",host="star",ladder="chat",provider="local",result="won"}'
        values: '0+0.1x90'
      - series: 'api_llm_steps_total{job="api",host="star",ladder="chat",provider="claude",result="won"}'
        values: '0+5x90'
      - series: 'api_llm_steps_total{job="api",host="star",ladder="chat",provider="claude",result="skipped_budget"}'
        values: '0+50x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiLlmRequestsRefused
      - eval_time: 75m
        alertname: ApiLlmRequestsRefused
        exp_alerts:
          - exp_labels:
              ladder: chat
              provider: proxy_fast
              severity: warning
              service: api
            exp_annotations:
              summary: "Provider proxy_fast refuses the requests of ladder chat"
              description: "failed_request means the request itself was refused: HTTP 400, 413 or 422, an invalid or too large request, or a request over the worker limits. Retrying the same request cannot help and the breaker does not count it. A share over 5% of the steps that ran, at least 3 in 30 minutes, held for 30 minutes, means this provider refuses every such request, for example an account out of credit or a request shape it does not take: every turn loses one call to that step until the account or the config is fixed. Read the step error in the api log."
