[worker]
id = "env:WORKER_NODE_NAME"
build = "dev"
trust = "trusted"
work_dir = "/work"
contract = "/app/contract/worker-contract.json"

[nats]
url = "env:NATS_URL"
user = "env:NATS_USER"
password = "env:NATS_PASSWORD"
ping = { interval_s = 5, max_outstanding = 2 }
outbox = { max_results = 256, max_mib = 64 }

[runtime]
mode = "slot"
device = "auto"
release_after_call = true
recycle_after_calls = 10000
recycle_gap_mib = 1024
idle_unload_s = 0
oom_unload = true
onednn = true
shutdown_grace_s = 60
allow_slow_lanes = false
threads = 0
isolate_encode = false
memory_reserve_mib = 1536

[lanes]
enabled = ["audio", "lyrics", "transcribe", "encode", "collab", "taste", "ai"]
capacity = { audio = 16, lyrics = 32, transcribe = 4, encode = 32, collab = 1, taste = 1, ai = 64, speak = 1, highlight = 2, video-find = 1, video-vlm = 1, video-keyframe = 1, video-shot = 1, video-assemble = 1 }
required = { audio = true, lyrics = true, transcribe = true, encode = true, collab = true, taste = true, ai = true, speak = true, highlight = true, video-find = true, video-vlm = true, video-keyframe = true, video-shot = true, video-assemble = true }
required_grace_s = 300

