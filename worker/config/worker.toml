download_idle_s = 20
max_download_mib = 96
min_duration_s = 5.0
max_duration_s = 450.0
silence_dbfs = -60.0
fingerprint_s = 120

[video]
analysis_s = 180.0
max_verified = 2
max_candidate_s = 600.0
max_download_mib = 96
download_timeout_s = 240
window_s = 5.0
window_stride_s = 2.5
ber_max = 0.15
overlap_min_s = 8.0
peak_min = 12
vote_hamming = 4
max_pad_s = 15.0
encode_height = 480
encode_crf = 27
encode_maxrate_kbps = 1400
encode_fps = 30
max_upload_mib = 64

[video.classifier]
still_motion_med = 0.01
still_motion_p90 = 0.05
zoom_explained = 0.7
over_still_static_share = 0.5
animated_clip_div = 0.08
short_file_s = 15.0
loop_certain = 0.95
loop_likely = 0.85
cut_limit_per_min = 2.0
uncertain_margin = 0.15
static_margin = 0.3

[video_gen]
max_download_mib = 64
download_timeout_s = 120
encode_crf = 20
encode_preset = "medium"
audio_kbps = 160
max_output_mib = 64
offload = true

[video_gen.keyframe]
steps = 40
true_cfg_scale = 4.0

[video_gen.shot]
steps = 4
guidance_scale = 1.0
guidance_scale_2 = 1.0
lora_repo = "lightx2v/Wan2.2-Lightning"
lora_revision = "18bccf8884ec0a078eed79785eb4ef13ea16ce1e"
