[worker]
trust = "public"

[runtime]
mode = "lane"
device = "cuda"
idle_unload_s = 600
turn_groups = { keyframe = ["image-edit"], shot = ["image-to-video"] }

[lanes]
enabled = ["video-keyframe", "video-shot"]
capacity = { video-keyframe = 1, video-shot = 1 }
required = { video-keyframe = false, video-shot = false }

[video_gen]
offload = true
