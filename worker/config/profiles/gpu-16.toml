[worker]
trust = "public"

[runtime]
mode = "slot"
device = "cuda"
idle_unload_s = 600

[lanes]
enabled = ["audio", "lyrics", "transcribe"]
capacity = { audio = 8, lyrics = 16, transcribe = 2 }
required = { audio = false, lyrics = false, transcribe = false, encode = false, collab = false, ai = false }

[slots.muq]
max_batch = 3

[slots.mulan]
max_batch = 6

[slots.text]
max_batch = 12000

[slots.sep]
replicas = 1
max_batch = 1

[slots.asr]
replicas = 1
max_batch = 4

[slots.align]
replicas = 1

[slots.mms]
replicas = 1
max_batch = 4
