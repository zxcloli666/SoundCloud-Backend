[project]
name = "worker"
version = "2.0.0"
requires-python = "==3.12.*"
dependencies = [
    "nats-py==2.16.0",
    "aiohttp==3.14.3",
    "orjson==3.12.0",
    "numpy>=2,<3",
    "jsonschema>=4.23",
    "soxr>=0.5",
    "soundfile>=0.13",
    "librosa>=0.11",
    "psutil>=6",
    "huggingface-hub>=1.5,<2",
    "httpx==0.28.1",
    "easydict==1.13",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "sentence-transformers==6.1.0",
    "muq==0.1.0",
    "silero-vad==6.2.1",
    "melband-roformer-infer==0.1.5",
    "ctc-forced-aligner",
    "fasttext-numpy2==0.10.4",
    "gensim==4.4.0",
    "nagisa==0.3.0",
    "soynlp==0.0.493",
    "uroman==1.3.1.1",
    "pykakasi>=2.3",
    "unidecode>=1.4",
]

[project.optional-dependencies]
llm-local = [
    "bitsandbytes>=0.50",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.130",
    "ruff>=0.14",
    "mypy>=2.3",
    "types-jsonschema>=4.23",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
]
cpu = [
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "torchcodec==0.15.0",
]
cu126 = [
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "torchcodec==0.15.0",
    "triton==3.7.1; sys_platform == 'linux'",
]
cu130 = [
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "torchvision==0.29.0",
    "torchcodec==0.15.0",
    "triton==3.8.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv]
index-strategy = "unsafe-best-match"
default-groups = ["dev", "cu126"]
conflicts = [
    [{ group = "cpu" }, { group = "cu126" }],
    [{ group = "cpu" }, { group = "cu130" }],
    [{ group = "cu126" }, { group = "cu130" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]
torchaudio = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]
torchcodec = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]
triton = [
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner", rev = "64293cc6d711e57666c4a8b098e9fd93b381fd88" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live NATS with JetStream (NATS_TEST_URL)",
    "models: needs CUDA and cached model weights",
    "eval: needs the eval manifest and audio (EVAL_DATA_DIR)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "nagisa",
    "uroman",
    "silero_vad",
    "mel_band_roformer.*",
    "ml_collections.*",
    "ctc_forced_aligner.*",
    "gensim.*",
]
ignore_missing_imports = true
