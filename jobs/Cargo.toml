[package]
name = "jobs"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
async-nats = "0.49"
axum = "0.8"
base64 = "0.22"
bytes = "1"
caseless = "0.2"
chacha20poly1305 = "=0.10.1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
admin-catalog = { version = "0.1.0", path = "../utils/admin-catalog" }
backend-contracts = { version = "1.0.0", path = "../backend-contracts" }
catalog-normalize = { version = "0.1.0", path = "../utils/catalog-normalize" }
call-relay = { path = "../utils/call/relay" }
catalog-ingest = { version = "0.1.0", path = "../utils/catalog-ingest" }
catalog-match = { version = "0.1.0", path = "../utils/catalog-match" }
catalog-sources = { version = "0.1.0", path = "../utils/catalog-sources" }
llm-ladder = { version = "0.1.0", path = "../utils/llm-ladder" }
sc-transport = { version = "0.1.0", path = "../utils/sc-transport" }
redact = { version = "0.1.0", path = "../utils/redact" }
wt = { package = "write-through", version = "0.1.0", path = "../utils/write-through", features = ["sqlx"] }
repl-verify = { version = "0.1.0", path = "../utils/repl-verify" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
regex = "1"
qdrant-client = "1"
sc-fingerprint = { path = "../utils/sc-fingerprint" }
wreq = { version = "0.16.1", features = ["json", "form", "stream", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
tempfile = "3.27"
thiserror = "2.0.19"
tikv-jemallocator = "0.6"
tls-common = { path = "../utils/tls-common" }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
unidecode = "0.3"
urlencoding = "2.1.3"
url = "2.5.4"
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
