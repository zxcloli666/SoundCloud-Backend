[package]
name = "jobs"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-nats = "0.49"
axum = "0.8"
base64 = "0.22"
sha2 = "0.10"
backend-contracts = { version = "1.0.0", path = "../backend-contracts" }
catalog-normalize = { version = "0.1.0", path = "../utils/catalog-normalize" }
call-relay = { path = "../utils/call/relay" }
catalog-ingest = { version = "0.1.0", path = "../utils/catalog-ingest" }
catalog-match = { version = "0.1.0", path = "../utils/catalog-match" }
catalog-sources = { version = "0.1.0", path = "../utils/catalog-sources" }
sc-transport = { version = "0.1.0", path = "../utils/sc-transport" }
redact = { version = "0.1.0", path = "../utils/redact" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
qdrant-client = "1"
sc-fingerprint = { path = "../utils/sc-fingerprint" }
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
tempfile = "3.27"
thiserror = "2.0.19"
tikv-jemallocator = "0.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
urlencoding = "2.1.3"
url = "2.5.4"
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
