name: Images

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '.dockerignore'
      - 'scripts/cargo-skeleton.sh'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '.dockerignore'
      - 'scripts/cargo-skeleton.sh'
      - '.github/workflows/images.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            internal: |
              call/Cargo.toml
              call/crypto
              call/lua-macros
              call/proto
              call/relay
          - name: jobs
            internal: |
              call/Cargo.toml
              call/crypto
              call/lua-macros
              call/proto
              call/relay
          - name: streaming
            internal: |
              call/Cargo.toml
              call/crypto
              call/lua-macros
              call/proto
              call/relay
              decrypt
              decrypt-client
          - name: storage
          - name: gateway
    env:
      real: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        if: matrix.internal && env.real == 'true'
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.internal }}

      - name: Real call and decrypt crates
        if: matrix.internal && env.real == 'true'
        env:
          INTERNAL: ${{ matrix.internal }}
        run: |
          for path in $INTERNAL; do
            rm -rf "utils/$path"
            mkdir -p "utils/$(dirname "$path")"
            mv "_internal/$path" "utils/$path"
          done

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v4
        if: env.real == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.name }}/Dockerfile
          push: false
          tags: soundcloud-backend-${{ matrix.name }}:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cache/scd-${{ matrix.name }}:release
