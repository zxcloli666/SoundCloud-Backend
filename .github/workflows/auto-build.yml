name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: contains(github.event.head_commit.message, '!release') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the next version
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TYPE="${VERSION_INPUT:-patch}"
          else
            RELEASE_TYPE=$(echo "$COMMIT_MSG" | grep -oP '!release:\s*\K(major|minor|patch)' || echo "patch")
          fi

          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LAST_VERSION=${LAST_TAG#v}
          LAST_VERSION=${LAST_VERSION:-0.0.0}
          IFS=. read -r MA MI PA <<< "$LAST_VERSION"

          case "$RELEASE_TYPE" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            *)     PA=$((PA + 1)) ;;
          esac
          NEW_VERSION="$MA.$MI.$PA"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: api
            context: .
            file: api/Dockerfile
            sources: api backend-contracts utils
            internal: call
            cache: scd-api:release
          - name: jobs
            image: jobs
            context: .
            file: jobs/Dockerfile
            sources: jobs backend-contracts utils api/migrations api/migrations-ops api/queries
            internal: call
            cache: scd-jobs:release
          - name: streaming
            image: streaming
            context: streaming
            sources: streaming utils
            internal: |
              call
              decrypt
              decrypt-client
            cache: scd-streaming:release
            build_contexts: |
              tls-common=utils/tls-common
              call=utils/call
              decrypt=utils/decrypt
              decrypt-client=utils/decrypt-client
              stream-ticket=utils/stream-ticket
              sc-fingerprint=utils/sc-fingerprint
              entity-ref=utils/entity-ref
          - name: storage
            image: storage
            context: storage
            sources: storage utils
            cache: scd-storage:release
            build_contexts: |
              tls-common=utils/tls-common
              sc-fingerprint=utils/sc-fingerprint
              entity-ref=utils/entity-ref
          - name: gateway
            image: gateway
            context: gateway
            sources: gateway utils
            cache: scd-gateway:release
            build_contexts: tls-common=utils/tls-common
          - name: worker-cpu
            image: worker
            context: worker
            file: worker/docker/Dockerfile
            sources: worker
            flavor: cpu
            suffix: -cpu
            only_versioned: true
            extra_tags: worker:cpu
            cache: scd-worker:cpu
          - name: worker-gpu
            image: worker
            context: worker
            file: worker/docker/Dockerfile
            sources: worker
            flavor: cu126
            suffix: -gpu
            only_versioned: true
            extra_tags: worker:gpu worker:gpu-cuda12
            cache: scd-worker:gpu
            free_disk: true
          - name: worker-gpu-cuda13
            image: worker
            context: worker
            file: worker/docker/Dockerfile
            sources: worker
            flavor: cu130
            suffix: -gpu-cuda13
            only_versioned: true
            extra_tags: worker:gpu-cuda13
            cache: scd-worker:gpu-cuda13
            free_disk: true
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        if: matrix.internal
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: ${{ matrix.internal }}

      - name: Names
        id: names
        env:
          IMAGE: ${{ matrix.image }}
          SUFFIX: ${{ matrix.suffix }}
          SOURCES: ${{ matrix.sources }}
          INTERNAL: ${{ matrix.internal }}
          ONLY_VERSIONED: ${{ matrix.only_versioned }}
          EXTRA_TAGS: ${{ matrix.extra_tags }}
        run: |
          repo=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          trees=$(
            for entry in $SOURCES scripts/cargo-skeleton.sh .dockerignore .github/workflows/auto-build.yml; do git rev-parse "HEAD:$entry"; done
            for entry in $INTERNAL; do git -C _internal rev-parse "HEAD:$entry"; done
          )
          source_tag="$repo/$IMAGE:src-$(echo "$trees" | sha256sum | cut -c1-16)$SUFFIX"
          {
            echo "source=$source_tag"
            echo "tags<<EOF"
            echo "$repo/$IMAGE:$VERSION$SUFFIX"
            [ "$ONLY_VERSIONED" = true ] || echo "$repo/$IMAGE:latest"
            for tag in $EXTRA_TAGS; do echo "$repo/$tag"; done
            echo "EOF"
            echo "cache=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/cache/${{ matrix.cache }}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for an image built from the same sources
        id: built
        env:
          SOURCE: ${{ steps.names.outputs.source }}
        run: |
          if docker buildx imagetools inspect "$SOURCE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the existing image
        if: steps.built.outputs.found == 'true'
        env:
          SOURCE: ${{ steps.names.outputs.source }}
          TAGS: ${{ steps.names.outputs.tags }}
        run: |
          tags=()
          for tag in $TAGS; do tags+=(--tag "$tag"); done
          docker buildx imagetools create "${tags[@]}" "$SOURCE"

      - name: Real call and decrypt crates
        if: steps.built.outputs.found == 'false' && matrix.internal
        env:
          INTERNAL: ${{ matrix.internal }}
        run: |
          for crate in $INTERNAL; do
            rm -rf "utils/$crate"
            mv "_internal/$crate" "utils/$crate"
          done
          if [ ! -d utils/call/server ] || grep -q "call-relay disabled" utils/call/relay/src/lib.rs; then
            echo "::error::utils/call is still the mock relay"
            exit 1
          fi

      - uses: jlumbroso/free-disk-space@v2.0.0
        if: steps.built.outputs.found == 'false' && matrix.free_disk
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
          docker-images: false

      - uses: docker/setup-buildx-action@v4
        if: steps.built.outputs.found == 'false'
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/build-push-action@v7
        if: steps.built.outputs.found == 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build_contexts }}
          push: true
          provenance: false
          tags: |
            ${{ steps.names.outputs.tags }}
            ${{ steps.names.outputs.source }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            ${{ matrix.flavor && format('FLAVOR={0}', matrix.flavor) }}
          cache-from: type=registry,ref=${{ steps.names.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.names.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true
