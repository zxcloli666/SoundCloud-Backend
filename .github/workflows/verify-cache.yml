name: Verify cache

on: pull_request

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: First build
        run: |
          start=$(date +%s)
          docker buildx build -f jobs/Dockerfile --progress=plain . > first.log 2>&1
          echo "first build $(( $(date +%s) - start ))s"

      - name: Change one source line
        run: echo 'pub fn cache_probe() {}' >> utils/entity-ref/src/lib.rs

      - name: Second build
        run: |
          start=$(date +%s)
          docker buildx build -f jobs/Dockerfile --progress=plain . > second.log 2>&1
          echo "second build $(( $(date +%s) - start ))s"
          grep -E 'CACHED' second.log | sort -u | head -20
          grep -oE 'Compiling [a-z0-9_-]+ v[^ ]+' second.log | sort | tee compiled.txt | wc -l
          cat compiled.txt
