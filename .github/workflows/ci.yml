name: CI

on:
  push:
    branches: [main, chat/main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://scd:dev@localhost:5432/scd

jobs:
  jobs:
    name: Jobs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_USER: scd
          POSTGRES_DB: scd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scd"
          --health-interval 5s --health-timeout 5s --health-retries 12
      qdrant:
        image: mirror.gcr.io/qdrant/qdrant:v1.19.0
        ports: ['6333:6333', '6334:6334']
    env:
      QDRANT_URL: http://127.0.0.1:6334
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend-contracts -> target
            jobs -> target
          key: jobs

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client cmake clang libclang-dev pkg-config

      - name: Schema
        run: for file in api/migrations/*.sql api/migrations-ops/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"; done

      - name: Wait for Qdrant
        run: timeout 120 sh -c 'until curl -sf http://127.0.0.1:6333/readyz > /dev/null; do sleep 2; done'

      - name: Contracts
        working-directory: backend-contracts
        run: cargo test --all-targets --locked && cargo clippy --all-targets --locked -- -D warnings

      - name: Jobs
        working-directory: jobs
        run: cargo fmt --check && cargo test --all-targets --locked && cargo clippy --all-targets --locked -- -D warnings

      - name: Jobs live vector store
        working-directory: jobs
        run: cargo test --lib --locked indexing::result::live_tests -- --ignored --test-threads=1

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_USER: scd
          POSTGRES_DB: scd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scd"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      qdrant:
        image: mirror.gcr.io/qdrant/qdrant:v1.19.0
        ports: ['6333:6333', '6334:6334']
    env:
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://127.0.0.1:6334
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: api -> target
          key: api

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client cmake clang libclang-dev pkg-config

      - name: Schema
        run: for file in api/migrations/*.sql api/migrations-ops/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"; done

      - name: Format
        run: cargo fmt --manifest-path api/Cargo.toml --check && cargo fmt --manifest-path utils/redact/Cargo.toml --check

      - name: Wait for Qdrant
        run: timeout 120 sh -c 'until curl -sf http://127.0.0.1:6333/readyz > /dev/null; do sleep 2; done'

      - name: Tests
        working-directory: api
        run: |
          cargo test --manifest-path ../utils/redact/Cargo.toml --all-targets --locked
          cargo test --all-targets --locked
          cargo test --locked common::admission::tests -- --ignored
          cargo test --bin api --locked modules::chat::channel::tests -- --ignored
          cargo test --bin api --locked -- --ignored modules::rooms:: modules::chat::rooms:: router_rooms_tests plain_rooms_run_on_rt
          cargo test --bin api --locked modules::chat::sweeps::tests -- --ignored
          cargo test --bin api --locked -- --ignored modules::chat::limits::tests modules::chat::moderation::tests
          cargo test --bin api --locked recommendations::service::qdrant_io::live_tests -- --ignored --test-threads=1

      - name: Clippy
        working-directory: api
        run: cargo clippy --all-targets --locked -- -D warnings

  services:
    name: Streaming, storage, gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            streaming -> target
            utils/stream-ticket -> target
            storage -> target
            gateway -> target
          key: services

      - name: Stream ticket
        run: |
          cargo fmt --manifest-path utils/stream-ticket/Cargo.toml --check
          cargo test --manifest-path utils/stream-ticket/Cargo.toml --all-targets --locked

      - name: Streaming
        run: |
          cargo fmt --manifest-path streaming/Cargo.toml --check
          cargo test --manifest-path streaming/Cargo.toml --all-targets --locked

      - name: Storage
        run: cargo test --manifest-path storage/Cargo.toml --all-targets --locked

      - name: Gateway
        run: cargo check --manifest-path gateway/Cargo.toml --all-targets

  worker:
    name: Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint1

      - name: Unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Lock is current
        run: uv lock --check

      - name: Install
        run: uv sync --frozen --no-default-groups --group cpu --group dev

      - name: Format and lint
        run: .venv/bin/ruff format --check . && .venv/bin/ruff check .

      - name: Types
        run: .venv/bin/mypy

      - name: Tests
        run: .venv/bin/python -m pytest tests/unit tests/bus tests/runtime tests/contract

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v4
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: worker
          file: worker/docker/Dockerfile
          build-args: FLAVOR=cpu
          push: false
          tags: soundcloud-backend-worker:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cache/scd-worker:cpu

  prod:
    name: Real call and decrypt crates
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_USER: scd
          POSTGRES_DB: scd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scd"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt
            decrypt-client

      - name: Real crates
        run: |
          rm -rf utils/call utils/decrypt utils/decrypt-client
          mv _internal/call _internal/decrypt _internal/decrypt-client utils/

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            api -> target
            jobs -> target
            streaming -> target
          key: prod

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client protobuf-compiler cmake clang libclang-dev pkg-config

      - name: Schema
        run: for file in api/migrations/*.sql api/migrations-ops/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"; done

      - name: API
        run: cargo check --manifest-path api/Cargo.toml

      - name: Jobs
        run: cargo check --manifest-path jobs/Cargo.toml

      - name: Streaming
        run: cargo check --manifest-path streaming/Cargo.toml

  chat-wire:
    name: Chat wire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: utils/chat-wire -> target
          key: chat-wire

      - name: Format
        run: cargo fmt --manifest-path utils/chat-wire/Cargo.toml --check

      - name: Vectors
        run: cargo test --manifest-path utils/chat-wire/Cargo.toml --all-targets --locked

      - name: Clippy
        run: cargo clippy --manifest-path utils/chat-wire/Cargo.toml --all-targets --locked -- -D warnings
