name: CI

on:
  push:
    branches: [main, chat/main]
  pull_request:
    branches: [main, 'feat/ns-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  DATABASE_URL: postgres://scd:dev@localhost:5432/scd
  SAVE_TARGETS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scope.outputs.api }}
      jobs: ${{ steps.scope.outputs.jobs }}
      services: ${{ steps.scope.outputs.services }}
      prod: ${{ steps.scope.outputs.prod }}
      yanked: ${{ steps.scope.outputs.yanked }}
      worker: ${{ steps.scope.outputs.worker }}
      chat_load: ${{ steps.scope.outputs.chat_load }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: sh scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  api-tests:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://127.0.0.1:6334
      TARGETS: api/target utils/redact/target utils/telemetry/target
      TARGET_KEY: api/Cargo.lock utils/redact/Cargo.lock utils/telemetry/Cargo.lock scripts/ci-sqlx-template.patch
      IGNORED: >-
        test(~common::admission::tests) | test(~modules::chat::channel::tests) | test(~modules::rooms::) | test(~modules::chat::rooms::)
        | test(~router_rooms_tests) | test(~rt::router::tests) | test(~modules::chat::sweeps::tests)
        | test(~modules::chat::messages::fanout::tests) | test(~modules::chat::conversations::route_tests::wired)
        | test(~modules::chat::limits::tests) | test(~modules::chat::moderation::tests) | test(~modules::chat::reports::tests)
        | test(~modules::chat::admin::tests) | (test(~modules::chat::sync::tests) & !test(~soak_tests))
        | test(~modules::chat::synthetic::tests) | test(~modules::chat::devices::tests) | test(~modules::chat::keys::tests)
        | test(~modules::chat::invites::tests) | test(~modules::chat::settings::tests) | test(~qdrant_io::live_tests)
        | test(~modules::users::public::tests) | test(~modules::resolve::miss_tests)
        | test(~modules::remote::) | test(~router_voice_tests)
    steps:
      - uses: actions/checkout@v7

      - name: Services
        run: sh scripts/ci-db.sh up postgres redis qdrant nats

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Restore targets
        id: targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: api-tests
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: Fetch
        run: |
          cargo fetch --locked --manifest-path api/Cargo.toml
          cargo fetch --locked --manifest-path utils/redact/Cargo.toml
          cargo fetch --locked --manifest-path utils/telemetry/Cargo.toml
          sh scripts/ci-sqlx-template.sh api

      - name: System packages
        if: steps.targets.outputs.exact != 'true'
        uses: ./.github/actions/apt-packages
        with:
          packages: cmake clang libclang-dev pkg-config
          save: ${{ env.SAVE_TARGETS }}

      - name: Wait for services
        run: sh scripts/ci-db.sh wait

      - name: Utils
        run: |
          cargo nextest run --manifest-path utils/redact/Cargo.toml --all-targets --locked
          cargo nextest run --manifest-path utils/telemetry/Cargo.toml --all-targets --locked

      - name: Tests
        working-directory: api
        run: cargo nextest run --profile ci --config "$RUNNER_TEMP/sqlx-template.toml" --all-targets

      - name: Ignored tests
        working-directory: api
        run: cargo nextest run --profile ci --config "$RUNNER_TEMP/sqlx-template.toml" --bin api --run-ignored only --no-tests warn -E "$IGNORED"

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: api-tests
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

  chat-s3:
    name: Chat S3 tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://localhost:6379
      TARGETS: api/target
      TARGET_KEY: api/Cargo.lock utils/redact/Cargo.lock utils/telemetry/Cargo.lock scripts/ci-sqlx-template.patch
      CHAT_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      CHAT_TEST_S3_ACCESS_KEY: UPTESTAK
      CHAT_TEST_S3_SECRET_KEY: UPTESTSECRET
    steps:
      - uses: actions/checkout@v7

      - name: Services
        run: sh scripts/ci-db.sh up postgres redis seaweed

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - name: Restore targets
        id: targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: api-tests
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: Fetch
        run: |
          cargo fetch --locked --manifest-path api/Cargo.toml
          sh scripts/ci-sqlx-template.sh api

      - name: System packages
        if: steps.targets.outputs.exact != 'true'
        uses: ./.github/actions/apt-packages
        with:
          packages: cmake clang libclang-dev pkg-config

      - name: Wait for services
        run: sh scripts/ci-db.sh wait

      - name: SeaweedFS tests
        working-directory: api
        run: cargo test --config "$RUNNER_TEMP/sqlx-template.toml" --bin api -- --ignored s3_live

  api-clippy:
    name: API clippy
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGETS: api/target
      TARGET_KEY: api/Cargo.lock
    steps:
      - uses: actions/checkout@v7

      - name: Services
        run: sh scripts/ci-db.sh up postgres

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - name: Shared test migrator
        run: |
          if git grep -n 'sqlx::test(migrations = "' -- '*.rs'; then
            echo '::error::sqlx::test(migrations = "<dir>") inlines every migration into each test; use migrator = "crate::db::TEST_MIGRATOR" (api) or "crate::db::migrations::TEST_CORE" (jobs)'
            exit 1
          fi

      - name: Format
        run: |
          cargo fmt --manifest-path api/Cargo.toml --check
          cargo fmt --manifest-path utils/redact/Cargo.toml --check
          cargo fmt --manifest-path utils/telemetry/Cargo.toml --check

      - name: Restore targets
        id: targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: api-clippy
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: System packages
        if: steps.targets.outputs.exact != 'true'
        uses: ./.github/actions/apt-packages
        with:
          packages: cmake clang libclang-dev pkg-config
          save: ${{ env.SAVE_TARGETS }}

      - name: Wait for services
        run: sh scripts/ci-db.sh wait

      - name: Clippy
        working-directory: api
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: api-clippy
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

  jobs-tests:
    name: Jobs tests
    needs: changes
    if: needs.changes.outputs.jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      QDRANT_URL: http://127.0.0.1:6334
      TARGETS: backend-contracts/target jobs/target utils/admin-catalog/target
      TARGET_KEY: backend-contracts/Cargo.lock jobs/Cargo.lock utils/admin-catalog/Cargo.lock scripts/ci-sqlx-template.patch
    steps:
      - uses: actions/checkout@v7

      - name: Services
        run: sh scripts/ci-db.sh up postgres qdrant

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Restore targets
        id: targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: jobs-tests
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: Fetch
        run: |
          cargo fetch --locked --manifest-path backend-contracts/Cargo.toml
          cargo fetch --locked --manifest-path jobs/Cargo.toml
          cargo fetch --locked --manifest-path utils/admin-catalog/Cargo.toml
          sh scripts/ci-sqlx-template.sh jobs

      - name: System packages
        if: steps.targets.outputs.exact != 'true'
        uses: ./.github/actions/apt-packages
        with:
          packages: cmake clang libclang-dev pkg-config
          save: ${{ env.SAVE_TARGETS }}

      - name: Wait for services
        run: sh scripts/ci-db.sh wait

      - name: Contracts
        working-directory: backend-contracts
        run: cargo nextest run --all-targets --locked

      - name: Tests
        working-directory: jobs
        run: cargo nextest run --profile ci --config "$RUNNER_TEMP/sqlx-template.toml" --all-targets

      - name: Live vector store
        working-directory: jobs
        run: cargo nextest run --profile ci --config "$RUNNER_TEMP/sqlx-template.toml" --lib --run-ignored only --no-tests warn -E 'test(~indexing::result::live_tests)'

      - name: Admin catalog
        working-directory: utils/admin-catalog
        run: cargo nextest run --config "$RUNNER_TEMP/sqlx-template.toml" --all-targets

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: jobs-tests
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

  jobs-clippy:
    name: Jobs clippy
    needs: changes
    if: needs.changes.outputs.jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGETS: backend-contracts/target jobs/target
      TARGET_KEY: backend-contracts/Cargo.lock jobs/Cargo.lock
    steps:
      - uses: actions/checkout@v7

      - name: Services
        run: sh scripts/ci-db.sh up postgres

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - name: Format
        run: cargo fmt --manifest-path jobs/Cargo.toml --check

      - name: Restore targets
        id: targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: jobs-clippy
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: System packages
        if: steps.targets.outputs.exact != 'true'
        uses: ./.github/actions/apt-packages
        with:
          packages: cmake clang libclang-dev pkg-config
          save: ${{ env.SAVE_TARGETS }}

      - name: Wait for services
        run: sh scripts/ci-db.sh wait

      - name: Contracts
        working-directory: backend-contracts
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy
        working-directory: jobs
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: jobs-clippy
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

  services:
    name: Streaming, storage, gateway
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGETS: streaming/target utils/stream-ticket/target storage/target gateway/target
      TARGET_KEY: streaming/Cargo.lock utils/stream-ticket/Cargo.lock storage/Cargo.lock gateway/Cargo.lock
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: services
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: Stream ticket
        run: |
          cargo fmt --manifest-path utils/stream-ticket/Cargo.toml --check
          cargo test --manifest-path utils/stream-ticket/Cargo.toml --all-targets --locked

      - name: Streaming
        run: |
          cargo fmt --manifest-path streaming/Cargo.toml --check
          cargo test --manifest-path streaming/Cargo.toml --all-targets --locked

      - name: Storage
        run: cargo test --manifest-path storage/Cargo.toml --all-targets --locked

      - name: Gateway
        run: cargo check --manifest-path gateway/Cargo.toml --all-targets

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: services
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

  yanked:
    name: Yanked crates
    needs: changes
    if: needs.changes.outputs.yanked == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Lockfiles
        run: |
          failed=0
          for lock in $(git ls-files '*Cargo.lock'); do
            cargo deny --manifest-path "$(dirname "$lock")/Cargo.toml" --config deny.toml --locked check -W vulnerability advisories || failed=1
          done
          exit "$failed"

  worker:
    name: Worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        uses: ./.github/actions/apt-packages
        with:
          packages: ffmpeg libchromaprint1
          save: ${{ env.SAVE_TARGETS }}

      - name: Unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"
          enable-cache: true
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-glob: worker/uv.lock

      - name: Lock is current
        run: uv lock --check

      - name: Install
        run: uv sync --frozen --no-default-groups --group cpu --group dev

      - name: Format and lint
        run: .venv/bin/ruff format --check . && .venv/bin/ruff check .

      - name: Types
        run: .venv/bin/mypy

      - name: Tests
        run: .venv/bin/python -m pytest tests/unit tests/bus tests/runtime tests/contract

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v4
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: worker
          file: worker/docker/Dockerfile
          build-args: FLAVOR=cpu
          push: false
          tags: soundcloud-backend-worker:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cache/scd-worker:cpu

  prod:
    name: Real call and decrypt crates
    needs: changes
    if: needs.changes.outputs.prod == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGETS: api/target jobs/target streaming/target
      TARGET_KEY: api/Cargo.lock jobs/Cargo.lock streaming/Cargo.lock
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt
            decrypt-client

      - name: Services
        run: sh scripts/ci-db.sh up postgres

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - name: Restore targets
        id: targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: prod
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: Real crates
        run: |
          internal=$(git -C _internal rev-parse HEAD)
          rm -rf utils/call utils/decrypt utils/decrypt-client
          mv _internal/call _internal/decrypt _internal/decrypt-client utils/
          if [ "$(cat .ci-internal-sha 2>/dev/null)" = "$internal" ]; then
            find utils/call utils/decrypt utils/decrypt-client -type f -exec touch -t 200001010000 {} +
          fi
          echo "$internal" > .ci-internal-sha

      - name: System packages
        uses: ./.github/actions/apt-packages
        with:
          packages: protobuf-compiler cmake clang libclang-dev pkg-config
          save: ${{ env.SAVE_TARGETS }}

      - name: Wait for services
        run: sh scripts/ci-db.sh wait

      - name: API
        run: cargo check --manifest-path api/Cargo.toml

      - name: Jobs
        run: cargo check --manifest-path jobs/Cargo.toml

      - name: Streaming
        run: cargo check --manifest-path streaming/Cargo.toml

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: prod
          paths: .ci-internal-sha ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

  chat-load:
    name: Chat load harness
    needs: changes
    if: needs.changes.outputs.chat_load == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGETS: scripts/chat-load/target
      TARGET_KEY: scripts/chat-load/Cargo.lock
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: sh scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: chat-load
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}

      - name: Format
        run: cargo fmt --manifest-path scripts/chat-load/Cargo.toml --check

      - name: Tests
        run: cargo test --manifest-path scripts/chat-load/Cargo.toml --all-targets --locked

      - name: Clippy
        run: cargo clippy --manifest-path scripts/chat-load/Cargo.toml --all-targets --locked -- -D warnings

      - name: Save targets
        if: env.SAVE_TARGETS == 'true'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: chat-load
          paths: ${{ env.TARGETS }}
          key: ${{ env.TARGET_KEY }}
