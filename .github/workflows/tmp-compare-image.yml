name: tmp-compare-image
on:
  workflow_dispatch:
  push:
    branches: [ perf/api-reads ]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            call/Cargo.toml
            call/crypto
            call/lua-macros
            call/proto
            call/relay
      - name: Real call crates
        run: |
          for path in call/Cargo.toml call/crypto call/lua-macros call/proto call/relay; do
            rm -rf "utils/$path"
            mkdir -p "utils/$(dirname "$path")"
            mv "_internal/$path" "utils/$path"
          done
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: |
          repo=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "tag=$repo/api-compare:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "cache=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/cache/scd-api:release" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.tag }}
          cache-from: type=registry,ref=${{ env.cache }}
